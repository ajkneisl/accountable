name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/web/**
      - frontend/shared/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::445567081553:role/accountableDeployRole
  ECS_CLUSTER: accountable
  ECS_SERVICE: accountable

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/accountable-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/accountable-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/web/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.ecr.outputs.registry }}/accountable-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/accountable-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition accountable \
            --query taskDefinition > task-definition.json

      - id: backend-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.ecr.outputs.registry }}/accountable-backend:${{ github.sha }}

      - id: web-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.backend-def.outputs.task-definition }}
          container-name: web
          image: ${{ steps.ecr.outputs.registry }}/accountable-web:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          # The service is created with 0 tasks; the first deploy brings it up.
          desired-count: 1
          wait-for-service-stability: true
